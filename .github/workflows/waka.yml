name: WakaTime
# Desativado por padrao: o card "productive-time" ja cobre "tempo de codigo" sem plugin.
# Para reativar o WakaTime, veja SETUP.md (secret + readicionar os marcadores no README).
on:
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_OS: true
          SHOW_PROJECTS: true
          SHOW_TIME: true
